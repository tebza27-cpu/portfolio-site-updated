<rect width="820" height="420" rx="24" fill="#111827"/>
<text x="40" y="60" fill="#38bdf8" font-size="28" font-family="Arial, sans-serif">Week 3 - Basic SQL Functions</text>
<rect x="40" y="100" width="320" height="220" rx="18" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="140" fill="#fff" font-size="18">Data preparation</text>
