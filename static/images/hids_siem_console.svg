<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="SIEM console project overview image">
  <style>
    .screen { fill:#0f172a; stroke:#94a3b8; stroke-width:2; rx:16; }
    .tile { fill:#1e293b; stroke:#64748b; stroke-width:1.5; rx:10; }
    .text { fill:#e2e8f0; font-family:Verdana, sans-serif; font-size:15px; }
  </style>
  <rect x="20" y="20" width="560" height="220" class="screen" />
  <text x="40" y="50" class="text">SIEM Console - Registered HIDS Agents</text>
  <rect x="40" y="80" width="220" height="80" class="tile" />
  <rect x="280" y="80" width="260" height="80" class="tile" />
  <rect x="40" y="170" width="500" height="50" class="tile" />
  <text x="150" y="120" class="text">Agent Health</text>
  <text x="400" y="120" class="text">Event Summary</text>
  <text x="300" y="200" class="text">Active alerts, log ingestion and security status dashboard</text>
</svg>
