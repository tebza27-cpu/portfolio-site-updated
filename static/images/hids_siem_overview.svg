<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="HIDS to SIEM workflow diagram">
  <style>
    .box { fill:#1f2937; stroke:#9ca3af; stroke-width:2; rx:12; }
    .text { fill:#f9fafb; font-family:sans-serif; font-size:18px; }
    .arrow { fill:none; stroke:#10b981; stroke-width:4; marker-end:url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#10b981" />
    </marker>
  </defs>
  <rect x="30" y="90" width="160" height="80" class="box" />
  <text x="110" y="130" text-anchor="middle" class="text">Host / Endpoint</text>
  <text x="110" y="155" text-anchor="middle" class="text">with HIDS agent</text>

  <rect x="220" y="40" width="160" height="80" class="box" />
  <text x="300" y="80" text-anchor="middle" class="text">HIDS Agent</text>
  <text x="300" y="105" text-anchor="middle" class="text">Registration</text>

  <rect x="410" y="90" width="160" height="80" class="box" />
  <text x="490" y="130" text-anchor="middle" class="text">SIEM Console</text>
  <text x="490" y="155" text-anchor="middle" class="text">Event Monitoring</text>

  <path d="M190,130 C230,130 250,70 220,80" class="arrow" />
  <path d="M380,130 C420,130 440,180 410,180" class="arrow" />
</svg>
