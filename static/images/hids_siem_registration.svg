<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="HIDS agent registration process diagram">
  <style>
    .box { fill:#111827; stroke:#60a5fa; stroke-width:2; rx:10; }
    .text { fill:#f8fafc; font-family:Arial, sans-serif; font-size:16px; }
    .arrow { fill:none; stroke:#38bdf8; stroke-width:4; marker-end:url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#38bdf8" />
    </marker>
  </defs>
  <rect x="40" y="40" width="170" height="70" class="box" />
  <text x="125" y="75" text-anchor="middle" class="text">Install HIDS</text>
  <text x="125" y="95" text-anchor="middle" class="text">on Endpoint</text>

  <rect x="220" y="160" width="170" height="70" class="box" />
  <text x="305" y="195" text-anchor="middle" class="text">Configure</text>
  <text x="305" y="215" text-anchor="middle" class="text">Agent Registry</text>

  <rect x="400" y="40" width="160" height="70" class="box" />
  <text x="480" y="75" text-anchor="middle" class="text">Validate</text>
  <text x="480" y="95" text-anchor="middle" class="text">SIEM Entry</text>

  <path d="M210,70 L220,70" class="arrow" />
  <path d="M240,160 L240,130 C240,110 260,90 280,90" class="arrow" />
  <path d="M360,160 L400,160" class="arrow" />
</svg>
