<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title>Anatomy of a Hack overview diagram</title>
<desc>Simple attack chain with reconnaissance, exploitation, and containment stages.</desc>
<rect width="800" height="420" fill="#0f172a" rx="24"/>
<g fill="#fff" font-family="Arial, sans-serif" font-size="20">
  <text x="40" y="60" font-size="28" fill="#38bdf8">Attack Chain Overview</text>
  <rect x="40" y="100" width="220" height="80" fill="#1d4ed8" rx="16"/>
  <text x="60" y="145">Reconnaissance</text>
  <rect x="290" y="100" width="220" height="80" fill="#2563eb" rx="16"/>
  <text x="310" y="145">Access</text>
  <rect x="540" y="100" width="220" height="80" fill="#0ea5e9" rx="16"/>
  <text x="560" y="145">Post-Exploitation</text>
  <path d="M260 140 L290 140" stroke="#fff" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M510 140 L540 140" stroke="#fff" stroke-width="8" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff"/>
    </marker>
  </defs>
</g>
</svg>